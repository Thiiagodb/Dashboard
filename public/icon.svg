<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1E293B" stroke-width="8" />
  
  <!-- Financial bar chart -->
  <rect x="110" y="270" width="56" height="130" rx="12" fill="#1E293B" />
  <rect x="190" y="210" width="56" height="190" rx="12" fill="#047857" />
  <rect x="270" y="150" width="56" height="250" rx="12" fill="#10B981" />
  <rect x="350" y="100" width="56" height="300" rx="12" fill="url(#accentGrad)" />

  <!-- Trending upward arrow line -->
  <path d="M110 300 L210 230 L290 170 L390 110" fill="none" stroke="#34D399" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="390" cy="110" r="16" fill="#34D399" />
</svg>
